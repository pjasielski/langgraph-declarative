[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-declarative"
version = "0.1.0"
description = "Compile YAML workflow definitions into LangGraph CompiledStateGraph objects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Piotr" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/pjasielski/langgraph-declarative"
Homepage = "https://github.com/pjasielski/langgraph-declarative"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_declarative"]

[tool.pytest.ini_options]
testpaths = ["tests"]
