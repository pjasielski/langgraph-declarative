[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-declarative"
version = "0.3.0"
description = "Declarative YAML workflow definitions for LangGraph — topology as config, logic in Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Piotr Jasielski", email = "piotr.jasielski@gmail.com" },
]
keywords = ["langgraph", "langchain", "yaml", "workflow", "declarative", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langgraph>=1.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.18",
    "langgraph-checkpoint-sqlite>=2.0",
]
openai = [
    "langchain-openai>=0.3",
]
anthropic = [
    "langchain-anthropic>=0.3",
]

[project.urls]
Repository = "https://github.com/pjasielski/langgraph-declarative"
Homepage = "https://github.com/pjasielski/langgraph-declarative"
Changelog = "https://github.com/pjasielski/langgraph-declarative/blob/main/CHANGELOG.md"
Issues = "https://github.com/pjasielski/langgraph-declarative/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_declarative"]

# The sdist carries what is needed to build, test and learn the package — not
# the repo's planning docs or local tooling (.claude/, .maestro/, docs/).
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "schema",
    "examples",
    "template",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
