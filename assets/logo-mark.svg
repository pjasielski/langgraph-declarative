<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="langgraph-declarative">
  <title>langgraph-declarative</title>
  <defs>
    <linearGradient id="lgd" x1="4" y1="8" x2="60" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- YAML lines -->
  <g fill="url(#lgd)">
    <rect x="4" y="18" width="20" height="5" rx="2.5"/>
    <rect x="4" y="30" width="26" height="5" rx="2.5"/>
    <rect x="4" y="42" width="16" height="5" rx="2.5"/>
  </g>

  <!-- config feeding the graph -->
  <g stroke="url(#lgd)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M26 20.5 H34"/>
    <path d="M32 32.5 H47"/>
    <path d="M22 44.5 H34"/>
  </g>

  <!-- graph edges -->
  <g stroke="url(#lgd)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M43.5 23.5 L50.5 29.5"/>
    <path d="M43.5 41.5 L50.5 35.5"/>
  </g>

  <!-- nodes -->
  <g fill="url(#lgd)">
    <circle cx="39" cy="20.5" r="5"/>
    <circle cx="39" cy="44.5" r="5"/>
    <circle cx="54" cy="32.5" r="6"/>
  </g>
</svg>
